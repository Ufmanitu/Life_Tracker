<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Habit Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%; min-height: 100vh;
  background: #07111f;
  font-family: 'Montserrat', sans-serif;
  color: #fff;
  overflow-x: hidden;
}

body {
  background-image:
    radial-gradient(ellipse at 15% 15%, #0c1e3f 0%, transparent 55%),
    radial-gradient(ellipse at 85% 85%, #091830 0%, transparent 55%);
}

/* ── LAYOUT ── */
#app { display: flex; flex-direction: column; min-height: 100vh; }

/* ── HEADER ── */
#header {
  padding: clamp(20px, 3vw, 36px) clamp(16px, 4vw, 48px) 0;
  display: flex; align-items: center;
  justify-content: space-between; flex-wrap: wrap; gap: 16px;
}

#month-title {
  font-size: clamp(32px, 6vw, 58px);
  font-weight: 900; letter-spacing: -2px; line-height: 1;
}
#month-sub { font-size: clamp(11px, 1.5vw, 14px); color: #4a6a9a; letter-spacing: 3px; margin-top: 6px; font-weight: 600; }

.nav-row { display: flex; align-items: center; gap: 14px; }
.nav-btn {
  background: #0d1e3a; border: 1.5px solid #1e3060; border-radius: 8px;
  color: #7090c0; width: clamp(36px, 4vw, 44px); height: clamp(36px, 4vw, 44px);
  cursor: pointer; font-size: clamp(22px, 3vw, 28px);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Montserrat', sans-serif; transition: background 0.2s, transform 0.1s;
}
.nav-btn:hover { background: #1a2d50; }
.nav-btn:active { transform: scale(0.93); }
#year-label { font-size: clamp(16px, 2vw, 20px); color: #7090c0; min-width: 70px; text-align: center; font-weight: 700; }

.tab-switcher {
  display: flex; background: #0d1e3a; border-radius: 12px; overflow: hidden;
  border: 1.5px solid #1e3060;
}
.tab-btn {
  padding: clamp(10px, 1.5vw, 14px) clamp(18px, 3vw, 28px);
  font-size: clamp(11px, 1.4vw, 13px); font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; border: none; cursor: pointer;
  font-family: 'Montserrat', sans-serif; transition: all 0.2s;
  color: #4a6a9a; background: transparent;
}
.tab-btn.active { background: #4f6ef7; color: #fff; }

/* ── STATS ROW ── */
#stats-row {
  padding: clamp(16px, 2.5vw, 28px) clamp(16px, 4vw, 48px) 0;
  display: flex; gap: clamp(12px, 2vw, 20px); flex-wrap: wrap; align-items: center;
}
.stat-card {
  background: #0d1e3a; border: 1.5px solid #1e3060; border-radius: 14px;
  padding: clamp(12px, 1.5vw, 18px) clamp(16px, 2.5vw, 28px);
  display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 100px;
}
.stat-label { font-size: clamp(9px, 1.2vw, 11px); color: #4a6a9a; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
.stat-val { font-size: clamp(26px, 4vw, 38px); font-weight: 900; color: #fff; line-height: 1; }

.radial-wrap { position: relative; flex-shrink: 0; }
.radial-text {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; pointer-events: none;
}
.radial-pct { font-size: clamp(16px, 2vw, 22px); font-weight: 800; color: #fff; font-family: 'Montserrat', sans-serif; }
.radial-sub { font-size: clamp(9px, 1vw, 11px); color: #7090c0; margin-top: 2px; }

/* ── TRACKER ── */
#tracker-section { padding: clamp(16px, 2.5vw, 28px) clamp(16px, 4vw, 48px) clamp(20px, 3vw, 40px); overflow-x: auto; flex: 1; }
#tracker-inner { display: flex; gap: 0; }

#habit-names-col { min-width: clamp(160px, 22vw, 260px); flex-shrink: 0; }
.habit-name-header {
  height: clamp(56px, 7vw, 72px);
  display: flex; align-items: flex-end; padding-bottom: 10px;
  font-size: clamp(14px, 1.8vw, 18px); font-weight: 800; color: #fff; letter-spacing: 0.5px;
}
.habit-name-row {
  height: clamp(40px, 5vw, 52px); display: flex; align-items: center; gap: 8px; padding-right: 14px;
}
.habit-name-text { font-size: clamp(12px, 1.4vw, 15px); color: #c0d4f0; font-weight: 600; flex: 1; line-height: 1.25; }
.habit-remove-btn {
  background: none; border: none; color: #2a3d5e; cursor: pointer;
  font-size: clamp(18px, 2vw, 22px); line-height: 1; flex-shrink: 0; opacity: 0.4;
  transition: opacity 0.2s, color 0.2s; padding: 0 4px;
  font-family: 'Montserrat', sans-serif;
}
.habit-remove-btn:hover { opacity: 1; color: #e05a9a; }

#weeks-container { display: flex; gap: clamp(5px, 1vw, 10px); flex: 1; }
.week-col { flex: 1 1 0; min-width: 0; }
.week-header {
  border-radius: 10px 10px 0 0; padding: clamp(8px, 1vw, 12px) 0 clamp(6px, 0.8vw, 10px);
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(11px, 1.3vw, 14px); font-weight: 800; letter-spacing: 1px; color: #fff;
}
.week-days-row {
  display: flex; gap: clamp(3px, 0.5vw, 6px); padding: clamp(4px, 0.6vw, 8px) clamp(4px, 0.6vw, 8px) clamp(3px, 0.5vw, 6px);
}
.day-header-cell { flex: 1; text-align: center; }
.day-dow { font-size: clamp(9px, 1vw, 11px); font-weight: 700; }
.day-num { font-size: clamp(9px, 1vw, 11px); color: #4a6a9a; margin-top: 2px; }
.week-habit-row {
  display: flex; gap: clamp(3px, 0.5vw, 6px);
  padding: clamp(2px, 0.3vw, 4px) clamp(4px, 0.6vw, 8px);
  height: clamp(40px, 5vw, 54px); align-items: center;
}
.checkbox {
  flex: 1; aspect-ratio: 1/1; max-width: clamp(28px, 3.5vw, 42px); height: auto;
  border-radius: 6px; flex-shrink: 0;
  border: 2.5px solid #2a3d6e; background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s cubic-bezier(.4,0,.2,1); min-height: clamp(26px, 3vw, 38px);
}
.checkbox.done { transform: scale(1.06); }
.checkbox svg { display: none; width: 55%; height: 55%; }
.checkbox.done svg { display: block; }
.week-footer {
  border-radius: 0 0 10px 10px; padding: clamp(6px, 0.8vw, 10px) clamp(4px, 0.6vw, 8px);
  display: flex; justify-content: center;
  font-size: clamp(12px, 1.4vw, 16px); font-weight: 800;
}

/* ── ADD HABIT ── */
#add-habit-row { margin-top: clamp(18px, 2.5vw, 28px); display: flex; gap: 10px; max-width: 480px; }
#new-habit-input {
  flex: 1; background: #0d1e3a; border: 1.5px solid #1e3060; border-radius: 10px;
  padding: clamp(10px, 1.5vw, 14px) clamp(14px, 2vw, 20px); color: #fff;
  font-size: clamp(13px, 1.5vw, 16px); font-family: 'Montserrat', sans-serif;
  outline: none; transition: border-color 0.2s;
}
#new-habit-input:focus { border-color: #4f6ef7; }
#new-habit-input::placeholder { color: #2a4060; }
#add-habit-btn {
  background: #4f6ef7; border: none; border-radius: 10px; color: #fff;
  padding: clamp(10px, 1.5vw, 14px) clamp(18px, 2.5vw, 28px);
  font-size: clamp(13px, 1.5vw, 16px); font-weight: 700; cursor: pointer;
  font-family: 'Montserrat', sans-serif; transition: background 0.2s, transform 0.1s;
  white-space: nowrap;
}
#add-habit-btn:hover { background: #3a5de0; }
#add-habit-btn:active { transform: scale(0.96); }

/* ── ANALYSIS ── */
#analysis-section { padding: clamp(16px, 2.5vw, 32px) clamp(16px, 4vw, 48px) clamp(20px, 3vw, 40px); display: flex; flex-direction: column; gap: clamp(16px, 2.5vw, 28px); }
.analysis-card {
  background: #0d1e3a; border: 1.5px solid #1e3060; border-radius: 16px;
  padding: clamp(16px, 2vw, 24px) clamp(18px, 2.5vw, 28px);
}
.section-title { font-size: clamp(11px, 1.3vw, 14px); font-weight: 800; color: #7090c0; letter-spacing: 2px; text-transform: uppercase; }

.habit-bar-row { display: flex; align-items: center; gap: clamp(10px, 1.5vw, 18px); margin-top: clamp(10px, 1.5vw, 16px); }
.habit-bar-label { font-size: clamp(12px, 1.4vw, 15px); color: #c0d4f0; min-width: clamp(140px, 20vw, 220px); font-weight: 600; }
.habit-bar-track { flex: 1; height: clamp(14px, 1.8vw, 20px); background: #071020; border-radius: 10px; overflow: hidden; max-width: 260px; }
.habit-bar-fill { height: 100%; border-radius: 10px; transition: width 0.6s cubic-bezier(.4,0,.2,1); }
.habit-bar-pct { font-size: clamp(12px, 1.4vw, 15px); font-weight: 800; min-width: 50px; text-align: right; }

.week-radials { display: flex; gap: clamp(12px, 2vw, 24px); margin-top: clamp(12px, 1.8vw, 20px); flex-wrap: wrap; }
.week-radial-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.week-radial-label { font-size: clamp(11px, 1.3vw, 14px); font-weight: 700; }

.bar-chart-wrap { display: flex; align-items: flex-end; gap: clamp(5px, 1vw, 10px); height: clamp(80px, 10vw, 110px); margin-top: clamp(12px, 1.5vw, 18px); }
.bar-chart-col { display: flex; flex-direction: column; align-items: center; flex: 1; height: 100%; justify-content: flex-end; }
.bar-chart-bar { width: 100%; border-radius: 4px 4px 0 0; transition: height 0.5s cubic-bezier(.4,0,.2,1); }
.bar-chart-lbl { font-size: clamp(9px, 1vw, 12px); color: #7090c0; margin-top: 4px; font-weight: 600; }

.overall-row { display: flex; align-items: center; gap: clamp(20px, 3vw, 36px); margin-top: clamp(14px, 1.8vw, 20px); }
.overall-stats div { font-size: clamp(13px, 1.6vw, 16px); color: #7090c0; margin-bottom: 6px; font-weight: 500; }

.hidden { display: none !important; }

/* ── SAVE INDICATOR ── */
#save-indicator {
  position: fixed; bottom: 20px; right: 24px;
  background: #1a3060; border: 1.5px solid #3ecfb2; border-radius: 10px;
  padding: 8px 18px; font-size: 13px; font-weight: 700; color: #3ecfb2;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
  z-index: 100; letter-spacing: 0.5px;
}
#save-indicator.show { opacity: 1; }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  #header { gap: 10px; }
  .tab-switcher { order: 3; width: 100%; }
  .tab-btn { flex: 1; text-align: center; }
  .stat-card { min-width: calc(33% - 8px); }
}

@media (max-width: 640px) {
  .stat-card { flex: 1 1 calc(50% - 6px); }
  #habit-names-col { min-width: 130px; }
  .habit-name-text { font-size: 11px; }
  .week-header { font-size: 10px; padding: 6px 0; }
  .week-footer { font-size: 11px; }
  .habit-bar-label { min-width: 110px; font-size: 11px; }
  .overall-row { flex-direction: column; }
  #add-habit-row { max-width: 100%; }
}

@media (max-width: 480px) {
  .day-dow, .day-num { font-size: 8px; }
  #habit-names-col { min-width: 110px; }
}
</style>
</head>
<body>

<div id="app">

<!-- HEADER -->
<div id="header">
  <div>
    <div id="month-title">April</div>
    <div id="month-sub">— Habit Tracker —</div>
  </div>
  <div class="nav-row">
    <button class="nav-btn" id="prev-month">&#8249;</button>
    <span id="year-label">2026</span>
    <button class="nav-btn" id="next-month">&#8250;</button>
  </div>
  <div class="tab-switcher">
    <button class="tab-btn active" data-tab="tracker">Tracker</button>
    <button class="tab-btn" data-tab="analysis">Analysis</button>
  </div>
</div>

<!-- STATS ROW -->
<div id="stats-row">
  <div class="stat-card">
    <div class="stat-label">Habits</div>
    <div class="stat-val" id="stat-habits">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Completed</div>
    <div class="stat-val" id="stat-done">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Progress</div>
    <div class="stat-val" id="stat-pct">0%</div>
  </div>
  <div style="margin-left:auto;flex-shrink:0;">
    <div class="radial-wrap" id="overall-radial" style="width:clamp(80px,10vw,110px);height:clamp(80px,10vw,110px);">
      <svg id="overall-svg" width="100%" height="100%" viewBox="0 0 100 100" style="transform:rotate(-90deg)">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#1e3060" stroke-width="9"/>
        <circle id="overall-arc" cx="50" cy="50" r="42" fill="none" stroke="#3ecfb2" stroke-width="9"
          stroke-dasharray="0 263.9" stroke-linecap="round" style="transition:stroke-dasharray 0.6s cubic-bezier(.4,0,.2,1)"/>
      </svg>
      <div class="radial-text">
        <span class="radial-pct" id="overall-pct-text">0%</span>
        <span class="radial-sub" id="overall-sub-text">0/0</span>
      </div>
    </div>
  </div>
</div>

<!-- TRACKER SECTION -->
<div id="tracker-section">
  <div id="tracker-inner">
    <div id="habit-names-col">
      <div class="habit-name-header">My Habits</div>
      <div id="habit-names-list"></div>
    </div>
    <div id="weeks-container"></div>
  </div>
  <div id="add-habit-row">
    <input type="text" id="new-habit-input" placeholder="Add a new habit..." />
    <button id="add-habit-btn">+ Add</button>
  </div>
</div>

<!-- ANALYSIS SECTION -->
<div id="analysis-section" class="hidden">
  <div class="analysis-card">
    <div class="section-title">Daily Consistency</div>
    <div class="bar-chart-wrap" id="bar-chart-days"></div>
  </div>
  <div class="analysis-card">
    <div class="section-title">Habit Breakdown</div>
    <div id="habit-bars" style="margin-top:6px;display:flex;flex-direction:column;gap:8px;"></div>
  </div>
  <div class="analysis-card">
    <div class="section-title">Weekly Score</div>
    <div class="week-radials" id="week-radials"></div>
  </div>
  <div class="analysis-card">
    <div class="section-title">Overall Progress</div>
    <div class="overall-row">
      <div class="radial-wrap" style="width:clamp(90px,12vw,130px);height:clamp(90px,12vw,130px);">
        <svg width="100%" height="100%" viewBox="0 0 100 100" style="transform:rotate(-90deg)">
          <circle cx="50" cy="50" r="42" fill="none" stroke="#1e3060" stroke-width="9"/>
          <circle id="overall-arc-2" cx="50" cy="50" r="42" fill="none" stroke="#3ecfb2" stroke-width="9"
            stroke-dasharray="0 263.9" stroke-linecap="round" style="transition:stroke-dasharray 0.6s cubic-bezier(.4,0,.2,1)"/>
        </svg>
        <div class="radial-text">
          <span class="radial-pct" id="overall-pct-text-2">0%</span>
          <span class="radial-sub" id="overall-sub-text-2">0/0</span>
        </div>
      </div>
      <div class="overall-stats" id="overall-stats"></div>
    </div>
  </div>
</div>

</div><!-- #app -->

<div id="save-indicator">✓ Saved</div>

<script>
const DAYS = ["Mo","Tu","We","Th","Fr","Sa","Su"];
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEK_COLORS = ["#4f6ef7","#e05a9a","#3ecfb2","#f5a623","#a78bfa","#e07a3a"];
const WEEK_BG    = ["rgba(79,110,247,0.12)","rgba(224,90,154,0.12)","rgba(62,207,178,0.12)","rgba(245,166,35,0.12)","rgba(167,139,250,0.12)","rgba(224,122,58,0.12)"];

const CIRC = 2 * Math.PI * 42; // for viewBox 100×100 r=42

let saveTimer = null;

let state = {
  year: new Date().getFullYear(),
  month: new Date().getMonth(),
  habits: [
    "Wake up at 05:00 ⏰","Gym 💪","Work on Side Hustle 🌿",
    "Day Planning 📋","Budget Tracking 💰","Project Work 🎯",
    "No Alcohol 🚫","Social Media Detox 🌱","Goal Journaling 📓","Cold Shower ❄️"
  ],
  checked: {},
  tab: "tracker"
};

// ── STORAGE ──
function habitsKey() { return "ht_habits_v2"; }
function checkedKey() { return `ht_checked_v2_${state.year}_${state.month}`; }

function saveAll() {
  try {
    localStorage.setItem(habitsKey(), JSON.stringify(state.habits));
    localStorage.setItem(checkedKey(), JSON.stringify(state.checked));
  } catch(e) { console.warn("Save failed:", e); }
  flashSaved();
}

function loadHabits() {
  try {
    const h = localStorage.getItem(habitsKey());
    if (h) state.habits = JSON.parse(h);
  } catch(e) {}
}

function loadChecked() {
  try {
    const c = localStorage.getItem(checkedKey());
    state.checked = c ? JSON.parse(c) : {};
  } catch(e) { state.checked = {}; }
}

function flashSaved() {
  const el = document.getElementById("save-indicator");
  el.classList.add("show");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => el.classList.remove("show"), 1400);
}

// ── HELPERS ──
function getDaysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
function getFirstDayOffset(y, m) { const d = new Date(y,m,1).getDay(); return d===0?6:d-1; }
function getDow(y, m, d) { const w = new Date(y,m,d).getDay(); return w===0?6:w-1; }
function getWeekIdx(d, offset) { return Math.floor((d-1+offset)/7); }
function isChecked(hi, d) { return !!state.checked[`${hi}_${d}`]; }

function toggleCheck(hi, d) {
  const k = `${hi}_${d}`;
  state.checked[k] = !state.checked[k];
  if (!state.checked[k]) delete state.checked[k];
  saveAll();
  render();
}

// ── STATS ──
function calcStats() {
  const days = getDaysInMonth(state.year, state.month);
  const total = state.habits.length * days;
  let done = 0;
  for (let hi = 0; hi < state.habits.length; hi++)
    for (let d = 1; d <= days; d++)
      if (isChecked(hi, d)) done++;
  return { days, total, done, pct: total > 0 ? (done/total)*100 : 0 };
}

function calcHabitPcts() {
  const days = getDaysInMonth(state.year, state.month);
  return state.habits.map((_, hi) => {
    let done = 0;
    for (let d = 1; d <= days; d++) if (isChecked(hi, d)) done++;
    return days > 0 ? (done/days)*100 : 0;
  });
}

function calcWeekTotals(weekGroups) {
  return weekGroups.map(days => {
    let done=0, possible=0;
    days.forEach(d => {
      possible += state.habits.length;
      state.habits.forEach((_, hi) => { if (isChecked(hi, d)) done++; });
    });
    return possible > 0 ? Math.round((done/possible)*100) : 0;
  });
}

function calcDowTotals() {
  const days = getDaysInMonth(state.year, state.month);
  return DAYS.map((_, di) => {
    let done=0, possible=0;
    for (let d=1; d<=days; d++) {
      if (getDow(state.year, state.month, d) === di) {
        possible += state.habits.length;
        state.habits.forEach((_, hi) => { if (isChecked(hi, d)) done++; });
      }
    }
    return possible > 0 ? Math.round((done/possible)*100) : 0;
  });
}

function getWeekGroups() {
  const days = getDaysInMonth(state.year, state.month);
  const offset = getFirstDayOffset(state.year, state.month);
  const groups = [];
  for (let d=1; d<=days; d++) {
    const wi = getWeekIdx(d, offset);
    if (!groups[wi]) groups[wi] = [];
    groups[wi].push(d);
  }
  return groups.filter(g => g && g.length > 0);
}

// ── RADIAL ARC ──
function updateArc(id, pct) {
  const el = document.getElementById(id);
  if (!el) return;
  const dash = (pct / 100) * CIRC;
  el.setAttribute("stroke-dasharray", `${dash.toFixed(2)} ${CIRC.toFixed(2)}`);
}

function makeRadialHTML(pct, color, size) {
  const sz = size || 80;
  const dash = (pct / 100) * CIRC;
  return `<div class="radial-wrap" style="width:${sz}px;height:${sz}px;">
    <svg width="${sz}" height="${sz}" viewBox="0 0 100 100" style="transform:rotate(-90deg)">
      <circle cx="50" cy="50" r="42" fill="none" stroke="#0d1e3a" stroke-width="9"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="${color}" stroke-width="9"
        stroke-dasharray="${dash.toFixed(2)} ${CIRC.toFixed(2)}" stroke-linecap="round"/>
    </svg>
    <div class="radial-text">
      <span style="font-size:${sz<85?'13':'16'}px;font-weight:800;color:#fff;font-family:'Montserrat',sans-serif;">${Math.round(pct)}%</span>
    </div>
  </div>`;
}

// ── RENDER ──
function render() {
  const { days, total, done, pct } = calcStats();
  const offset = getFirstDayOffset(state.year, state.month);
  const weekGroups = getWeekGroups();
  const weekTotals = calcWeekTotals(weekGroups);
  const habitPcts  = calcHabitPcts();
  const dowTotals  = calcDowTotals();

  // Header
  document.getElementById("month-title").textContent = MONTH_NAMES[state.month];
  document.getElementById("year-label").textContent  = state.year;

  // Stats
  document.getElementById("stat-habits").textContent = state.habits.length;
  document.getElementById("stat-done").textContent   = done;
  document.getElementById("stat-pct").textContent    = Math.round(pct) + "%";

  // Overall radial
  updateArc("overall-arc", pct);
  document.getElementById("overall-pct-text").textContent = Math.round(pct) + "%";
  document.getElementById("overall-sub-text").textContent = `${done}/${total}`;

  // Habit names
  const namesList = document.getElementById("habit-names-list");
  namesList.innerHTML = "";
  state.habits.forEach((h, hi) => {
    const row = document.createElement("div");
    row.className = "habit-name-row";
    row.innerHTML = `<span class="habit-name-text">${h}</span><button class="habit-remove-btn" data-hi="${hi}" title="Remove habit">×</button>`;
    namesList.appendChild(row);
  });

  // Weekly grids
  const weeksContainer = document.getElementById("weeks-container");
  weeksContainer.innerHTML = "";
  weekGroups.forEach((days_, wi) => {
    const col = document.createElement("div");
    col.className = "week-col";

    const hdr = document.createElement("div");
    hdr.className = "week-header";
    hdr.style.background = WEEK_COLORS[wi % WEEK_COLORS.length];
    hdr.textContent = `Week ${wi+1}`;
    col.appendChild(hdr);

    const daysRow = document.createElement("div");
    daysRow.className = "week-days-row";
    daysRow.style.background = WEEK_BG[wi % WEEK_BG.length];
    days_.forEach(d => {
      const cell = document.createElement("div");
      cell.className = "day-header-cell";
      cell.innerHTML = `<div class="day-dow" style="color:${WEEK_COLORS[wi%WEEK_COLORS.length]}">${DAYS[getDow(state.year, state.month, d)]}</div><div class="day-num">${d}</div>`;
      daysRow.appendChild(cell);
    });
    col.appendChild(daysRow);

    state.habits.forEach((_, hi) => {
      const row = document.createElement("div");
      row.className = "week-habit-row";
      row.style.background = WEEK_BG[wi % WEEK_BG.length];
      days_.forEach(d => {
        const ck = isChecked(hi, d);
        const box = document.createElement("div");
        box.className = "checkbox" + (ck ? " done" : "");
        box.style.border = `2.5px solid ${ck ? WEEK_COLORS[wi%WEEK_COLORS.length] : "#2a3d6e"}`;
        box.style.background = ck ? WEEK_COLORS[wi%WEEK_COLORS.length] + "28" : "transparent";
        box.dataset.hi = hi;
        box.dataset.d  = d;
        if (ck) {
          box.innerHTML = `<svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polyline points="2,6 5,9 10,3" stroke="${WEEK_COLORS[wi%WEEK_COLORS.length]}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>`;
        }
        row.appendChild(box);
      });
      col.appendChild(row);
    });

    const footer = document.createElement("div");
    footer.className = "week-footer";
    footer.style.background = WEEK_BG[wi % WEEK_BG.length];
    footer.style.color = WEEK_COLORS[wi % WEEK_COLORS.length];
    footer.textContent = weekTotals[wi] + "%";
    col.appendChild(footer);

    weeksContainer.appendChild(col);
  });

  // ── ANALYSIS ──
  // Day of week bar chart
  const barChartDays = document.getElementById("bar-chart-days");
  const maxH = 80;
  barChartDays.innerHTML = DAYS.map((dl, i) => {
    const h = Math.round((dowTotals[i]/100) * maxH);
    return `<div class="bar-chart-col">
      <div class="bar-chart-bar" style="height:${Math.max(h,2)}px;background:#4f6ef7;opacity:${dowTotals[i]===0?0.18:1};"></div>
      <div class="bar-chart-lbl">${dl}</div>
    </div>`;
  }).join("");

  // Habit bars
  const habitBarsEl = document.getElementById("habit-bars");
  habitBarsEl.innerHTML = "";
  state.habits.forEach((h, hi) => {
    const p = habitPcts[hi];
    const color = p >= 70 ? "#3ecfb2" : p >= 40 ? "#f5a623" : "#e05a9a";
    const row = document.createElement("div");
    row.className = "habit-bar-row";
    row.innerHTML = `
      <span class="habit-bar-label">${h}</span>
      <div class="habit-bar-track"><div class="habit-bar-fill" style="width:${p}%;background:${color};"></div></div>
      <span class="habit-bar-pct" style="color:${color};">${Math.round(p)}%</span>`;
    habitBarsEl.appendChild(row);
  });

  // Week radials
  const weekRadialsEl = document.getElementById("week-radials");
  weekRadialsEl.innerHTML = "";
  weekGroups.forEach((_, wi) => {
    const item = document.createElement("div");
    item.className = "week-radial-item";
    item.innerHTML = makeRadialHTML(weekTotals[wi], WEEK_COLORS[wi%WEEK_COLORS.length], 82) +
      `<span class="week-radial-label" style="color:${WEEK_COLORS[wi%WEEK_COLORS.length]}">Week ${wi+1}</span>`;
    weekRadialsEl.appendChild(item);
  });

  // Overall analysis radial
  updateArc("overall-arc-2", pct);
  document.getElementById("overall-pct-text-2").textContent = Math.round(pct) + "%";
  document.getElementById("overall-sub-text-2").textContent = `${done}/${total}`;
  document.getElementById("overall-stats").innerHTML = `
    <div><strong style="color:#fff;font-size:1.1em;">${done}</strong> &nbsp;habits completed</div>
    <div><strong style="color:#fff;font-size:1.1em;">${state.habits.length}</strong> &nbsp;habits tracked</div>
    <div><strong style="color:#fff;font-size:1.1em;">${getDaysInMonth(state.year, state.month)}</strong> &nbsp;days this month</div>`;
}

// ── EVENTS ──
document.getElementById("prev-month").addEventListener("click", () => {
  if (state.month === 0) { state.month = 11; state.year--; }
  else state.month--;
  loadChecked();
  render();
});

document.getElementById("next-month").addEventListener("click", () => {
  if (state.month === 11) { state.month = 0; state.year++; }
  else state.month++;
  loadChecked();
  render();
});

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    state.tab = btn.dataset.tab;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b === btn));
    document.getElementById("tracker-section").classList.toggle("hidden", state.tab !== "tracker");
    document.getElementById("analysis-section").classList.toggle("hidden", state.tab !== "analysis");
  });
});

document.getElementById("weeks-container").addEventListener("click", e => {
  const box = e.target.closest(".checkbox");
  if (box) toggleCheck(parseInt(box.dataset.hi), parseInt(box.dataset.d));
});

document.getElementById("habit-names-list").addEventListener("click", e => {
  const btn = e.target.closest(".habit-remove-btn");
  if (!btn) return;
  const hi = parseInt(btn.dataset.hi);
  const newChecked = {};
  Object.entries(state.checked).forEach(([k, v]) => {
    const parts = k.split("_");
    const h = parseInt(parts[0]), d = parseInt(parts[1]);
    if (h !== hi) newChecked[`${h > hi ? h-1 : h}_${d}`] = v;
  });
  state.habits.splice(hi, 1);
  state.checked = newChecked;
  saveAll();
  render();
});

document.getElementById("add-habit-btn").addEventListener("click", addHabit);
document.getElementById("new-habit-input").addEventListener("keydown", e => {
  if (e.key === "Enter") addHabit();
});

function addHabit() {
  const val = document.getElementById("new-habit-input").value.trim();
  if (val) {
    state.habits.push(val);
    document.getElementById("new-habit-input").value = "";
    saveAll();
    render();
  }
}

// ── INIT ──
loadHabits();
loadChecked();
render();
</script>
</body>
</html>
